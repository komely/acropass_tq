<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>나의 TQ · ACROPASS 트러블큐어 (시안)</title>
  <meta name="description" content="내 트러블 성향, 딱 알려드림 — 나의 TQ 트러블 성향 리포트 (시안)">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar" hidden>
      <div class="logo" aria-label="브랜드 로고">
        <span class="logo-img" aria-hidden="true"></span>
        <span class="logo-text" id="logoText">ACROPASS</span>
        <span class="logo-sub">나의 TQ</span>
      </div>
      <div class="topbar-right">
        <div class="points-chip" id="pointsChip" aria-live="polite">
          <span class="points-dot" aria-hidden="true"></span><b id="pointsNum">0</b><span id="pointsUnit">딱</span>
        </div>
        <button class="icon-btn" id="btnSettings" aria-label="설정">⚙</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="주요 메뉴" hidden>
      <button class="tab" data-tab="know"><span class="tab-ic">📋</span><span class="tab-tx">알기</span></button>
      <button class="tab" data-tab="cycle"><span class="tab-ic">🗓️</span><span class="tab-tx">주기</span></button>
      <button class="tab" data-tab="care"><span class="tab-ic">🌱</span><span class="tab-tx">돌보기</span></button>
      <button class="tab" data-tab="read"><span class="tab-ic">📖</span><span class="tab-tx">읽기</span></button>
      <button class="tab" data-tab="share"><span class="tab-ic">💌</span><span class="tab-tx">나누기</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="modal" hidden></div>
  </div>

  <!-- 데이터 (문구·설정은 data/ 폴더에서 수정) -->
  <script src="data/config.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/modules.js"></script>
  <script src="data/missions.js"></script>
  <script src="data/labnotes.js"></script>
  <script src="data/compat.js"></script>
  <script src="data/cycle.js"></script>
  <script src="data/columns.js"></script>
  <!-- 로직 -->
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/character.js"></script>
  <script src="js/cycle.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
